<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDE8E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Copenhagen Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* One warm studio look in both themes, on purpose: the clothes are photographed on cream. */
:root{
  color-scheme:light;
  --bg:#EDE8E1;--panel:#F7F4EF;--tile:#EFEAE3;--ink:#1D1B19;--mute:#6F685F;--line:#DCD4C9;
  --accent:#1F2A44;--good:#3E6A47;--warn:#8F5620;--bad:#963838;--shadow:rgba(40,30,20,.22);
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding:18px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;margin:0}
.meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
h2.sec{font-family:var(--serif);font-weight:500;font-size:24px;margin:22px 0 8px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.muted{color:var(--mute)}
.small{font-size:13px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,244,239,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
/* chips, buttons */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn{border:0;background:var(--ink);color:var(--panel);font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.soft{background:var(--tile);color:var(--ink)}
.btn.good{background:var(--good)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
/* flat lay */
.fit{position:relative;aspect-ratio:1/1;width:100%}
.fit img{position:absolute;object-fit:contain}
.fit .t{left:1%;top:3%;width:52%;height:46%;z-index:3}
.fit .o{left:47%;top:1%;width:52%;height:58%;z-index:2}
.fit .b{left:6%;top:47%;width:42%;height:52%;z-index:1}
.fit .s{left:52%;top:63%;width:44%;height:34%;z-index:4}
.fit.noouter .t{left:4%;top:3%;width:58%;height:50%}
.fit.noouter .b{left:8%;top:49%;width:44%;height:50%}
.fit.noouter .s{left:54%;top:52%;width:44%;height:36%}
img.user{filter:drop-shadow(0 6px 8px var(--shadow))}
.dots{display:inline-flex;vertical-align:middle}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:0 1px 3px var(--shadow);display:block}
.dots i+i{margin-left:-4px}
.verdict{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.05}
.v-ok{color:var(--good)}.v-warn{color:var(--warn)}.v-no{color:var(--bad)}
.vdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.vdot.ok{background:var(--good)}.vdot.warn{background:var(--warn)}.vdot.no{background:var(--bad)}
.notes{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.notes li{display:grid;grid-template-columns:16px 1fr;gap:6px;font-size:14px}
.ck{font-size:11px;padding:2px 7px;border:1px solid currentColor;border-radius:4px}
.ck.ok{color:var(--good)}.ck.warn{color:var(--warn)}.ck.no{color:var(--bad)}
/* today */
.weather{display:flex;justify-content:space-between;align-items:center;gap:10px}
.temp{font-family:var(--serif);font-size:44px;line-height:1}
.today h3{font-family:var(--serif);font-weight:500;font-size:28px;margin:4px 0 0;text-align:center}
.why{font-family:var(--serif);font-size:18px;line-height:1.35;text-align:center;margin:10px 4px 0}
/* mix */
.mixfit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.scorebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px}
.fix{margin-top:10px;display:grid;gap:6px}
.fix button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.fix button b{font-weight:600}
.slotrow{margin-top:14px}
.slothead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.slothead .nm{font-size:13px;font-weight:500}
.lock{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.lock[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.opt{flex:0 0 84px;height:92px;scroll-snap-align:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt img{width:100%;height:64px;object-fit:contain}
.opt span{font-size:10px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt[aria-pressed="true"]{border:2px solid var(--ink)}
.opt.off{opacity:.45}
.opt.none{font-size:12px;color:var(--mute)}
/* looks grid */
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;cursor:pointer}
.lcard .nm{font-family:var(--serif);font-size:18px;line-height:1.1;margin-top:4px}
.lcard .sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
/* good vs better */
.gb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px;margin-top:12px}
.gb-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.gb h4{font:600 20px/1 var(--sans);letter-spacing:-.02em;margin:8px 0 6px;text-transform:uppercase}
.gb .better h4{color:var(--good)}
.gb .dots i{width:26px;height:26px}.gb .dots i+i{margin-left:-9px}
.stack{display:flex;flex-direction:column;align-items:center;height:300px}
.stack img{object-fit:contain;max-width:100%}
.stack .st{height:38%}.stack .sb{height:44%;margin-top:-3%}.stack .ss{height:20%;margin-top:-4%}
.gb p{font-size:12px;color:var(--mute);margin:4px 0 0}
.gb .note{font-family:var(--serif);font-size:17px;text-align:center;margin:10px 4px 0;color:var(--ink)}
/* closet */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer}
.pc img{width:100%;aspect-ratio:1;object-fit:contain}
.pc .nm{font-size:12px;line-height:1.2;margin-top:2px}
.pc .ct{font-size:11px;color:var(--mute)}
.pc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;min-height:130px;color:var(--mute)}
.pc.add b{font-size:34px;font-weight:300;line-height:1;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
/* insights */
.bar{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar img{width:44px;height:44px;object-fit:contain}
.bar .n{font-weight:600}
.buy{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.buy i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 1px 3px var(--shadow)}
.plus{font-weight:600;color:var(--good)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(29,27,25,.35)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:10px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:28px;margin:4px 0 6px}
.close{position:absolute;right:12px;top:10px;border:0;background:var(--tile);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.field{display:grid;gap:4px;margin-top:12px}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
input[type=text],select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%}
.big{width:100%;aspect-ratio:1;object-fit:contain;background:var(--panel);border-radius:14px;border:1px solid var(--line)}
.progress{height:6px;background:var(--tile);border-radius:3px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.tips{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:14px;display:grid;gap:3px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--mute);text-align:center;padding:24px 8px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Closet</h1><span class="meta" id="meta"></span></header>
  <main>
    <section id="v-today"></section>
    <section id="v-mix" hidden></section>
    <section id="v-looks" hidden></section>
    <section id="v-closet" hidden></section>
    <section id="v-insights" hidden></section>
  </main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="mix"><svg viewBox="0 0 24 24"><path d="M4 7h11M4 17h7M19 7h1M15 17h5"/><circle cx="17" cy="7" r="2"/><circle cx="13" cy="17" r="2"/></svg>Mix</button>
  <button data-v="looks"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Looks</button>
  <button data-v="closet"><svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 1 1 2 2c-1 0-2 .6-2 1.6V9L3 15.5c-.9.6-.5 2 .6 2h16.8c1.1 0 1.5-1.4.6-2L12 9"/></svg>Closet</button>
  <button data-v="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
</div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="scrim"></div><div class="panel"><div class="grab"></div><button class="close" aria-label="Close">×</button><div id="sheetBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
/*__RULES_JS__*/
</script>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const HOSTED = !!window.CLOSET_HOSTED;   // published web page: no downloads, pop-ups or device location
const R = DATA.rules, OCCS = R.occasions, SLOTS = ["outer","top","bottom","shoes"];
const SLOTN = {outer:"Outer",top:"Top",bottom:"Bottom",shoes:"Shoes"}, CATN = {outer:"Outer",top:"Tops",bottom:"Bottoms",shoes:"Shoes"};
const COLOURS = {black:"#1B1B1C",charcoal:"#2E2F33",grey:"#80807E",white:"#F1EFE9",cream:"#E6DFD1",beige:"#C8B8A2",taupe:"#7A6E62",camel:"#B08A5A",brown:"#5A3F30",navy:"#1F2638",blue:"#6B86A6",olive:"#5A5E4C",green:"#3F5A45",burgundy:"#5C2430",rust:"#8A4A2C",dark:"#3F3A38"};
const TYPES = {
  top:[{id:"light",label:"T-shirt / light knit",a:{w:1}},{id:"knit",label:"Knit",a:{w:2}},{id:"chunky",label:"Chunky knit",a:{w:3,tex:"chunky"}},{id:"shirt",label:"Shirt",a:{w:1}},{id:"sweat",label:"Sweatshirt",a:{w:2,casual:1}}],
  outer:[{id:"coat",label:"Coat",a:{w:3}},{id:"pcoat",label:"Patterned coat",a:{w:3,tex:"pattern"}},{id:"puffer",label:"Puffer",a:{w:3,casual:1}},{id:"jacket",label:"Jacket",a:{w:2}},{id:"overshirt",label:"Overshirt",a:{w:2}}],
  bottom:[{id:"trouser",label:"Trousers",a:{kind:"trouser"}},{id:"chino",label:"Chinos",a:{kind:"chino"}},{id:"denim",label:"Jeans",a:{kind:"denim"}}],
  shoes:[{id:"loafer",label:"Loafers",a:{style:"loafer"}},{id:"boot",label:"Boots",a:{style:"boot"}},{id:"sneaker",label:"Sneakers",a:{style:"sneaker"}}]};
const ATTRS = ["w","tex","kind","style","casual"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ---------------- storage: IndexedDB, falls back to memory ---------------- */
const store = (() => {
  let db = null, mem = {};
  const open = () => new Promise(res => {
    try { const r = indexedDB.open("closet", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res();
    } catch (e) { res(); } });
  const get = k => new Promise(res => { if (!db) return res(mem[k]);
    try { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(mem[k]); } catch (e) { res(mem[k]); } });
  const set = (k, v) => new Promise(res => { mem[k] = v; if (!db) return res();
    try { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  return {open, get, set, persistent: () => !!db};
})();

/* ---------------- state ---------------- */
let U = {pieces:{}, hidden:[], looks:[], hiddenLooks:[], wear:[], prefs:{mode:"best", view:{}, loc:null}};
let P = {}, IMG = DATA.images;
function rebuild() {
  P = {};
  for (const p of DATA.pieces) if (!U.hidden.includes(p.key)) P[p.key] = {...p, ...(U.pieces[p.key] || {})};
  for (const [k, p] of Object.entries(U.pieces)) if (p.userAdded && !U.hidden.includes(k)) P[k] = p;
  cache = {};
}
async function save(part) { await store.set("U", U); if (part !== "prefs") { rebuild(); } }
const byCat = c => Object.keys(P).filter(k => P[k].cat === c);
function img(k) {
  const p = P[k] || DATA.archetypes.find(a => a.key === k);
  if (!p) return "";
  if (p.img) return p.img;
  const im = IMG[k]; if (!im) return "";
  const v = U.prefs.view[k] || (U.prefs.mode === "best" ? DATA.defaults[k] : U.prefs.mode);
  return v === "photo" && im.photo ? im.photo : im.ill;
}
const imgTag = (k, cls = "") => k && P[k] ? `<img class="${cls}${P[k].img ? " user" : ""}" src="${img(k)}" alt="${esc(P[k].name)}">` : "";
const dots = ks => `<span class="dots">${ks.filter(k => k && P[k]).map(k => `<i style="background:${P[k].hex}"></i>`).join("")}</span>`;
function fitHTML(pcs) { const [o,t,b,s] = pcs; return `<div class="fit ${o && P[o] ? "" : "noouter"}">${imgTag(o,"o")}${imgTag(b,"b")}${imgTag(t,"t")}${imgTag(s,"s")}</div>`; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
const valid = pcs => pcs.every((k, i) => i === 0 ? (!k || P[k]) : P[k]);

/* ---------------- looks ---------------- */
function allLooks() {
  const base = DATA.looks.looks.map((L, i) => ({...L, id: "b" + i})).filter(L => !U.hiddenLooks.includes(L.id));
  return [...U.looks.map(L => ({...L, mine: true})), ...base].filter(L => valid(L.pcs));
}
const lookById = id => allLooks().find(L => L.id === id);

/* ---------------- engine ---------------- */
let cold = true, cache = {};
const check = (pcs, occ) => Rules.check(pcs, P, R, occ, cold);
const verdict = res => Rules.verdict(res, R);
const strong = (pcs, occ) => verdict(check(pcs, occ)).cls === "ok";
function optsFor(cat, occ, onlyOcc = true) {
  const o = byCat(cat).filter(k => !onlyOcc || !occ || (P[k].occasions || []).includes(occ));
  return cat === "outer" ? [null, ...o] : o;
}
function combos(occ, fixed = [undefined, undefined, undefined, undefined]) {
  const pools = SLOTS.map((c, i) => fixed[i] !== undefined ? [fixed[i]] : optsFor(c, occ));
  const out = [];
  for (const a of pools[0]) for (const b of pools[1]) for (const c of pools[2]) for (const d of pools[3]) {
    const pcs = [a, b, c, d]; if (strong(pcs, occ)) out.push(pcs); }
  return out;
}
function strongFor(o) {  // every Strong match for one occasion, cached until data or season changes
  const key = "s" + o + cold; return cache[key] || (cache[key] = combos(o));
}
function strongAll() { const out = {}; for (const o of OCCS) out[o] = strongFor(o); return out; }
function versatility() {
  const key = "vers" + cold; if (cache[key]) return cache[key];
  const n = {}; Object.keys(P).forEach(k => n[k] = 0);
  const all = strongAll(); for (const o of OCCS) for (const pcs of all[o]) pcs.forEach(k => { if (k) n[k]++; });
  return cache[key] = n;
}
function fixIt(cur, occ, locks) {
  const free = SLOTS.map((_, i) => i).filter(i => !locks[i]);
  const vers = cache["vers" + cold] || {}, out = [];   // rank by versatility only if already scored
  for (const i of free) for (const k of optsFor(SLOTS[i], occ)) {
    if (k === cur[i]) continue; const c = [...cur]; c[i] = k;
    if (strong(c, occ)) out.push({pcs: c, swaps: [[i, cur[i], k]], score: vers[k] || 0});
  }
  if (!out.length) for (let a = 0; a < free.length; a++) for (let b = a + 1; b < free.length; b++) {
    const i = free[a], j = free[b];
    for (const k of optsFor(SLOTS[i], occ)) for (const m of optsFor(SLOTS[j], occ)) {
      if (k === cur[i] || m === cur[j]) continue; const c = [...cur]; c[i] = k; c[j] = m;
      if (strong(c, occ)) out.push({pcs: c, swaps: [[i, cur[i], k], [j, cur[j], m]], score: (vers[k] || 0) + (vers[m] || 0)});
    }
  }
  return out.sort((x, y) => y.score - x.score).slice(0, 3);
}
function suggestFor(key, n = 3) {   // diverse Strong matches that use one piece

    for (const pcs of combos(o, fx)) cands.push({occ: o, pcs}); }
  const saved = new Set(allLooks().map(L => L.pcs.join()));
  cands = cands.filter(c => !saved.has(c.pcs.join()));
  while (cands.length && picked.length < n) {
    let best = null, bs = Infinity;
    for (const c of cands) {

}

  $("impFile").onclick = () => { const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = async () => restore(await inp.files[0].text()); inp.click(); };
}
async function restore(text) {
  { try { const j = JSON.parse(text); if (j.app !== "closet") throw 0;
      U = {pieces: j.pieces || {}, hidden: j.hidden || [], looks: j.looks || [], hiddenLooks: j.hiddenLooks || [], wear: j.wear || [], prefs: j.prefs || {mode: "best", view: {}, loc: null}};
      await save(); todayList = null; closeSheet(); render(); toast("Backup restored"); } catch (e) { toast("That is not a Closet backup"); } }
}
document.querySelector("nav.tabs").onclick = e => { const b = e.target.closest("[data-v]"); if (b) show(b.dataset.v); };
(async () => {
  await store.open();
  const saved = await store.get("U"); if (saved) U = {...U, ...saved, prefs: {...U.prefs, ...(saved.prefs || {})}};
  rebuild();
  cold = R.warmth.months.includes(new Date().getMonth() + 1);
  let tab = "today"; try { tab = localStorage.getItem("closet_tab") || "today"; } catch (e) {}
  show(tab);
  await loadWeather(); todayList = null; if (view === "today" || view === "mix") render();
})();
